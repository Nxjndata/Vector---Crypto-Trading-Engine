[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-platform"
version = "0.1.0"
description = "Modular Crypto Algorithmic Trading Platform for Binance USDT-M Perpetual Futures"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Trading Infrastructure Engineer" }
]
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "sqlalchemy[asyncio]>=2.0.29,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "alembic>=1.13.1,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "websockets>=12.0.0,<18.0.0",
    "ntplib>=0.4.0,<1.0.0",
    "python-dateutil>=2.9.0,<3.0.0",
    "colorama>=0.4.6,<1.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1,<9.0.0",
    "pytest-asyncio>=0.23.6,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "ruff>=0.3.5,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto -m 'not testnet_live'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "testnet_live: marks tests requiring live Binance Futures Testnet connectivity and credentials (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]
